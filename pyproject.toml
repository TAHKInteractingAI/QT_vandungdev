[project]
name = "qt-vandung"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "lxml>=6.0",
    "openpyxl>=3.1",
    "googlenewsdecoder>=0.1.7",
    "selectolax>=0.4",
    "pillow>=12.0",
    "tqdm>=4.66",
    "urllib3>=2.7.0",
    "pympler>=1.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.1",
    "google-auth-httplib2>=0.4.2",
    "gspread>=6.2.1",
    "orjson>=3.12.0",
    "curl-cffi>=0.16.3",
    "rapidfuzz>=3.14.6",
    "selenium>=4.49.0",
]

[project.optional-dependencies]
other = [
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler", "linkedin_ceo_finder"]
