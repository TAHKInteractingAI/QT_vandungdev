[project]
name = "qt-vandung"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=6.0",
    "openpyxl>=3.1",
    "googlenewsdecoder>=0.1.7",
    "selectolax>=0.4",
    "pillow>=12.0",
    "gnews>=0.8.2",
    "matplotlib>=3.11.1",
    "ipykernel>=7.3.0",
    "tqdm>=4.66",
    "urllib3>=2.7.0",
    "pympler>=1.1",
    "ipywidgets>=8.1.9",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]
